<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RCS.CBS FLYER — Milad RCS.CBS</title>
<style>
  :root{
    --red:#D42B27; --brown:#7C4A2D; --sky1:#8FD3F4; --sky2:#D6F0FB;
    --ink:#2C2C2B; --ridge:#5FA8D3;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#0e1b24; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #wrap{
    position:relative; width:100%; max-width:440px; height:100vh; max-height:760px;
    box-shadow:0 20px 60px rgba(0,0,0,.45); overflow:hidden; background:#000;
    border-radius:0;
  }
  @media(min-width:460px){ #wrap{ border-radius:18px; height:96vh; } }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:28px; gap:14px; z-index:5;
    background:radial-gradient(120% 90% at 50% 15%, rgba(255,255,255,.14), rgba(6,20,30,.72));
    backdrop-filter:blur(2px);
  }
  .hidden{ display:none !important; }
  .logo{ width:104px; height:104px; border-radius:50%;
    box-shadow:0 8px 26px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.14);
    animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-10px) rotate(4deg);} }
  .title{ color:#fff; font-weight:800; letter-spacing:1px; font-size:30px; line-height:1.05;
    text-shadow:0 3px 12px rgba(0,0,0,.5); }
  .title span{ color:#ffd23f; }
  .sub{ color:rgba(255,255,255,.92); font-size:15px; font-weight:600; max-width:300px; }
  .milad{ display:inline-block; background:var(--red); color:#fff; font-weight:800;
    font-size:13px; letter-spacing:1.5px; padding:7px 16px; border-radius:999px;
    box-shadow:0 6px 18px rgba(212,43,39,.5); text-transform:uppercase; }
  .btn{ margin-top:6px; background:#ffd23f; color:#3a2a00; border:none; cursor:pointer;
    font-weight:800; font-size:17px; padding:14px 34px; border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.35); transition:transform .08s ease, filter .15s ease;
    min-height:48px; }
  .btn:active{ transform:translateY(2px) scale(.98); }
  .btn:hover{ filter:brightness(1.05); }
  .hint{ color:rgba(255,255,255,.8); font-size:13px; margin-top:2px; }
  .scoreline{ color:#fff; font-size:16px; font-weight:700; }
  .big{ font-size:52px; font-weight:800; color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.5); }
  .record{ color:#ffd23f; font-weight:800; font-size:15px; letter-spacing:.5px; }

  #hud{ position:absolute; top:16px; left:0; right:0; text-align:center; z-index:4;
    pointer-events:none; }
  #hud .n{ color:#fff; font-size:46px; font-weight:800;
    text-shadow:0 3px 10px rgba(0,0,0,.45); }
  .credit{ position:absolute; bottom:10px; left:0; right:0; text-align:center;
    color:rgba(255,255,255,.55); font-size:11px; z-index:6; letter-spacing:.5px; }
</style>
</head>

  <canvas id="game"></canvas>

document.getElementById('logoImg').src = LOGO_SRC;
document.getElementById('logoImg2').src = LOGO_SRC;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

// Fixed internal resolution for consistent physics
const W = 440, H = 760;
canvas.width = W; canvas.height = H;

const logo = new Image();
logo.src = LOGO_SRC;
let logoReady = false;
logo.onload = ()=> logoReady = true;

// State
let state = 'start'; // start | play | over
let score = 0;
let best = parseInt(localStorage.getItem('reichas_best')||'0',10);

const bird = { x: W*0.28, y: H*0.45, r: 26, vy: 0, rot: 0 };
const GRAV = 0.45, FLAP = -7.6, MAXV = 11;

const pipes = [];
const GAP = 200, PIPE_W = 74, SPACING = 250;
let dist = 0, speed = 2.7;

// Parallax layers
let bg1 = 0, bg2 = 0;
const confetti = [];

function reset(){
  bird.y = H*0.45; bird.vy = 0; bird.rot = 0;
  pipes.length = 0; dist = 0; score = 0; speed = 2.7;
  for(let i=0;i<3;i++) addPipe(W + 160 + i*SPACING);
}
function addPipe(x){
  const margin = 90;
  const top = margin + Math.random()*(H - GAP - margin*2 - 120);
  pipes.push({ x, top, passed:false });
}
function flap(){
  if(state==='play'){ bird.vy = FLAP; }
}

function startGame(){
  reset(); state='play';
  try{if(window.BWKAudio){window.BWKAudio.unlock();window.BWKAudio.playStart();}}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
}
function endGame(){try{if(window.BWKAudio){window.BWKAudio.unlock();window.BWKAudio.playGameOver();}}catch(e){}try{window.parent.postMessage({type:'pintu-game-score',game:'flyer',score:score},'*')}catch(e){}
  state='over';
  const newRecord = score > best;
  if(newRecord){ best = score; localStorage.setItem('reichas_best', String(best)); spawnConfetti(); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = best;
  document.getElementById('recordMsg').textContent = newRecord ? '🏆 REKOR BARU!' : 'Terus semangat!';
  document.getElementById('overScreen').classList.remove('hidden');
  document.getElementById('hudScore').textContent = '';
}

function spawnConfetti(){
  const cols = ['#D42B27','#ffd23f','#5FA8D3','#7C4A2D','#ffffff','#46A171'];
  for(let i=0;i<90;i++){
    confetti.push({ x:W/2, y:H*0.35, vx:(Math.random()-0.5)*8, vy:Math.random()*-9-2,
      s:4+Math.random()*6, c:cols[(Math.random()*cols.length)|0], a:1, rot:Math.random()*6 });
  }
}

// Input
function onPress(e){
  if(e){ e.preventDefault(); }
  if(state==='play') flap();
}
canvas.addEventListener('pointerdown', onPress);
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space' || e.code==='ArrowUp'){
    e.preventDefault();
    if(state==='start') startGame();
    else if(state==='play') flap();
    else if(state==='over') startGame();
  }
});
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// Drawing helpers
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6cc4ef'); g.addColorStop(0.55,'#bfe9fb'); g.addColorStop(1,'#eaf7ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,241,190,.9)';
  ctx.beginPath(); ctx.arc(W*0.8, H*0.16, 42, 0, Math.PI*2); ctx.fill();
}
function drawMountains(off, base, color, height){
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(-off, base);
  const peaks = 5, seg = (W+120)/peaks;
  for(let i=0;i<=peaks;i++){
    const px = -off + i*seg;
    const py = base - (i%2===0 ? height : height*0.55);
    ctx.lineTo(px, py);
    ctx.lineTo(px + seg/2, base);
  }
  ctx.lineTo(W+off, base); ctx.lineTo(W+off, H); ctx.lineTo(-off, H); ctx.closePath(); ctx.fill();
}
function drawPipe(p){
  // Mountain-style columns (green ridges)
  const grad = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
  grad.addColorStop(0,'#3f8f5a'); grad.addColorStop(0.5,'#59b078'); grad.addColorStop(1,'#3f8f5a');
  ctx.fillStyle=grad;
  // top
  roundRect(p.x, 0, PIPE_W, p.top, 10); ctx.fill();
  // bottom
  const by = p.top + GAP;
  roundRect(p.x, by, PIPE_W, H-by, 10); ctx.fill();
  // caps
  ctx.fillStyle='#2f7346';
  roundRect(p.x-5, p.top-18, PIPE_W+10, 18, 6); ctx.fill();
  roundRect(p.x-5, by, PIPE_W+10, 18, 6); ctx.fill();
  // snow caps decoration
  ctx.fillStyle='rgba(255,255,255,.75)';
  roundRect(p.x+6, p.top-14, PIPE_W-12, 6, 3); ctx.fill();
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  // shadow ring
  ctx.beginPath(); ctx.arc(0,0,bird.r+2,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fill();
  if(logoReady){
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.clip();
    ctx.drawImage(logo, -bird.r, -bird.r, bird.r*2, bird.r*2);
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fillStyle='#D42B27'; ctx.fill();
  }
  ctx.restore();
}
function drawGround(){
  ctx.fillStyle='#caa46a';
  ctx.fillRect(0,H-24,W,24);
  ctx.fillStyle='#b8925a';
  for(let i=0;i<W;i+=26){ ctx.fillRect(i - (dist*1.5%26), H-24, 13, 24); }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(2, (now-last)/16.67); last = now;
  ctx.clearRect(0,0,W,H);
  drawSky();

  if(state==='play'){ bg1 += speed*0.25*dt; bg2 += speed*0.5*dt; }
  drawMountains((bg1)%(W+120), H*0.72, '#9cc9e6', 150);
  drawMountains((bg2)%(W+120)+80, H*0.80, '#7fb6da', 120);

  if(state==='play'){
    bird.vy = Math.min(MAXV, bird.vy + GRAV*dt);
    bird.y += bird.vy*dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy/12));
    dist += speed*dt;
    speed = 2.7 + Math.min(2.3, score*0.05);

    for(const p of pipes){ p.x -= speed*dt; }
    if(pipes.length && pipes[0].x < -PIPE_W-10){ pipes.shift(); addPipe(pipes[pipes.length-1].x + SPACING); }

    for(const p of pipes){
      if(!p.passed && p.x + PIPE_W < bird.x){ p.passed=true; score++; try{if(window.BWKAudio)window.BWKAudio.playPoint();}catch(e){} }
      // collision
      if(bird.x+bird.r*0.7 > p.x && bird.x-bird.r*0.7 < p.x+PIPE_W){
        if(bird.y-bird.r*0.7 < p.top || bird.y+bird.r*0.7 > p.top+GAP){ endGame(); }
      }
    }
    if(bird.y+bird.r > H-24 || bird.y-bird.r < 0){ bird.y=Math.max(bird.r, bird.y); if(bird.y+bird.r>=H-24) endGame(); }
    document.getElementById('hudScore').textContent = score;
  } else if(state==='start'){
    bird.y = H*0.45 + Math.sin(now/300)*10;
  }

  for(const p of pipes) drawPipe(p);
  drawGround();
  if(state!=='start') drawBird();

  // confetti
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i]; c.vy+=0.25; c.x+=c.vx; c.y+=c.vy; c.a-=0.008; c.rot+=0.2;
    if(c.a<=0){ confetti.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,c.a); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.fillStyle=c.c; ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*0.6); ctx.restore();
  }

  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
window.addEventListener('message',function(e){if(!e.data||e.data.type!=='pintu-game-global')return;var g=document.getElementById('globalBest');if(g)g.textContent=Number(e.data.score||0).toLocaleString('id-ID');});</script>
<script>
(function(){
  var prefersReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MUTE_KEY = 'bwk_game_muted';
  try { var saved = localStorage.getItem(MUTE_KEY); } catch(e) {}
  var muted = saved === null ? prefersReduce : saved === '1';
  var actx = null, masterGain = null;
  function ensureCtx(){
    if (actx) return actx;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
      masterGain = actx.createGain();
      masterGain.gain.value = muted ? 0 : 0.35;
      masterGain.connect(actx.destination);
    } catch(e) { actx = null; }
    return actx;
  }
  function unlock(){ ensureCtx(); if (actx && actx.state === 'suspended') actx.resume(); }
  function blip(freq, durMs, type, vol){
    if (muted) return;
    var ctx = ensureCtx(); if (!ctx) return;
    type = type || 'sine';
    vol = vol == null ? 1 : vol;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6 * vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durMs / 1000);
    osc.connect(g); g.connect(masterGain);
    osc.start(t);
    osc.stop(t + durMs / 1000 + 0.02);
  }
  function sweep(freqs, durMs, type, vol){
    if (muted) return;
    var ctx = ensureCtx(); if (!ctx) return;
    type = type || 'triangle';
    vol = vol == null ? 1 : vol;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type;
    var step = durMs / 1000 / freqs.length;
    for (var i = 0; i < freqs.length; i++){
      osc.frequency.setValueAtTime(freqs[i], t + i * step);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5 * vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durMs / 1000);
    osc.connect(g); g.connect(masterGain);
    osc.start(t);
    osc.stop(t + durMs / 1000 + 0.02);
  }
  window.BWKAudio = {
    unlock: unlock,
    playStart: function(){ sweep([523.25, 659.25, 783.99], 220, 'triangle', 0.9); },
    playPoint:  function(){ blip(880, 70, 'square', 0.5); },
    playGameOver: function(){ sweep([440, 349.23, 261.63], 420, 'sawtooth', 0.8); },
    isMuted: function(){ return muted; },
    setMuted: function(m){
      muted = !!m;
      try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch(e) {}
      if (masterGain) masterGain.gain.value = muted ? 0 : 0.35;
      var btn = document.getElementById('muteBtn');
      if (btn) btn.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
    }
  };
  function wireMute(){
    var btn = document.getElementById('muteBtn');
    if (!btn) return;
    btn.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
    btn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      window.BWKAudio.unlock();
      window.BWKAudio.setMuted(!muted);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireMute);
  } else { wireMute(); }
})();
</script>
</body>
</html>
